[pytest]
testpaths = .
addopts = -ra -p no:cacheprovider
markers =
    root: starts gwlbtun (needs root: tun devices, raw sockets); run with tests/run.sh
    host_nic: needs the host's network interface and its receive queues (tests/run.sh --host)
    slow: takes a minute or more (deselect with -m "not slow")
