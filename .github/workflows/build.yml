name: build

# Build gwlbtun on Amazon Linux 2023 for both x86_64 and aarch64.
#   - pull_request to main : build both arches, attach binaries as (ephemeral) run artifacts.
#   - push to main         : build both arches AND roll the 'latest' GitHub Release forward,
#                            so main always has durable, downloadable binaries.
#   - push of a v* tag     : build both arches AND publish a durable, versioned GitHub Release
#                            (e.g. v3.2). Because the build runs `git describe --tags`, those
#                            binaries self-identify with the tag in their --help banner.
# Each arch builds natively (x86_64 and arm64 GitHub-hosted runners) inside an amazonlinux:2023
# container -- no QEMU, and the binary links AL2023's glibc.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs_on: ubuntu-24.04
          - arch: aarch64
            runs_on: ubuntu-24.04-arm   # GitHub-hosted arm64 runner (free for public repos)
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history + tags so `git describe --tags` stamps the version

      - name: Build in Amazon Linux 2023 container
        run: |
          docker run --rm -v "$PWD":/src -w /src amazonlinux:2023 \
            bash .github/scripts/build-al2023.sh

      - name: Collect binary
        run: |
          mkdir -p dist
          cp build/gwlbtun "dist/gwlbtun-linux-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: gwlbtun-linux-${{ matrix.arch }}
          path: dist/gwlbtun-linux-${{ matrix.arch }}
          if-no-files-found: error

  release-latest:
    name: release (latest, push to main)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # create/replace the release + tag
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true   # flatten both artifacts into dist/

      - name: Publish/refresh the 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Single rolling release: roll the 'latest' tag forward to this commit each push to main.
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest \
            dist/gwlbtun-linux-x86_64 dist/gwlbtun-linux-aarch64 \
            --repo "$GITHUB_REPOSITORY" \
            --target "${GITHUB_SHA}" \
            --title "Latest build (main)" \
            --notes "Automated Amazon Linux 2023 build of main (${GITHUB_SHA}). x86_64 + aarch64."

  release-tag:
    name: release (versioned, v* tag)
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # create the versioned release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the ${{ github.ref_name }} release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Durable, versioned release named after the tag (e.g. v3.2). --verify-tag ensures the
          # tag exists; create (not delete+create) so a published release is never clobbered.
          gh release create "${GITHUB_REF_NAME}" \
            dist/gwlbtun-linux-x86_64 dist/gwlbtun-linux-aarch64 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes "Amazon Linux 2023 build of ${GITHUB_REF_NAME} (${GITHUB_SHA}). x86_64 + aarch64. See HISTORY.md for the changelog."
